<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4G Proteção Veicular | Corretora Especializada</title>
  <link rel="shortcut icon" href="https://i.imgur.com/bv7IBPy.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #154F96; --yellow: #FFF029; --dark: #0F172A; --white: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Open Sans', sans-serif; }
    body { background: #f8fafc; color: var(--dark); line-height: 1.6; }
    
    header { background: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .logo { height: 50px; }
    
    .hero { background: linear-gradient(135deg, #0D3668, var(--primary)); color: white; padding: 80px 5%; text-align: center; }
    .hero h1 { font-family: 'Anton'; font-size: 45px; text-transform: uppercase; margin-bottom: 20px; }
    .form-box { background: white; max-width: 450px; margin: -60px auto 40px; padding: 30px; border-radius: 12px; color: black; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    
    .section { padding: 60px 5%; max-width: 1100px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; padding: 25px; border-radius: 10px; border: 1px solid #eee; text-align: center; }
    .card img { height: 60px; object-fit: contain; margin-bottom: 15px; }
    
    .float-btns { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
    .btn-float { width: 50px; height: 50px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; border: none; cursor: pointer; }
    
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
    .btn-submit { width: 100%; padding: 15px; background: var(--yellow); border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-family: 'Anton'; text-transform: uppercase; }
    
    footer { background: var(--dark); color: white; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<header>
    <img src="https://i.imgur.com/CopVuzQ.png" class="logo">
    <button onclick="document.getElementById('cotacao').scrollIntoView({behavior:'smooth'})" class="btn-submit" style="width:auto; padding:10px 20px;">COTAR AGORA</button>
</header>

<section class="hero">
    <h1>SEU VEÍCULO PROTEGIDO</h1>
    <p>A 4G compara as maiores seguradoras para você.</p>
</section>

<div class="form-box" id="cotacao">
    <h3>Cotação Rápida</h3>
    <form onsubmit="enviarDados(event, 'Cotação Direta')">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="tel" id="whatsapp" placeholder="WhatsApp" required>
        <input type="text" id="placa" placeholder="Placa do Veículo" required>
        <select id="tipo"><option>Carro de Passeio</option><option>Moto</option><option>Caminhão</option></select>
        <button type="submit" id="btn" class="btn-submit">ENVIAR</button>
    </form>
</div>

<section class="section" id="parceiros">
    <h2>Nossos Parceiros</h2>
    <div class="grid">
        <div class="card"><img src="https://i.imgur.com/otngD0v.png"><h3>Km</h3></div>
        <div class="card"><img src="https://i.imgur.com/NPQ7x8K.png"><h3>Capitalcar</h3></div>
        <div class="card"><img src="https://i.imgur.com/BxGRRlg.png"><h3>AGV</h3></div>
        <div class="card"><img src="https://i.imgur.com/p3mRPKR.png"><h3>Suhai</h3></div>
        <div class="card"><img src="https://i.imgur.com/5VqEkvj.png"><h3>APVS</h3></div>
        <div class="card"><img src="https://i.imgur.com/W39Pswx.png"><h3>Valecar</h3></div>
    </div>
</section>

<!-- Botões Flutuantes -->
<div class="float-btns">
    <a href="https://wa.me/5511957666488" class="btn-float" style="background:#25D366;"><i class="fab fa-whatsapp"></i></a>
    <a href="https://www.instagram.com/4gprotecaoveicular/" class="btn-float" style="background:#E1306C;"><i class="fab fa-instagram"></i></a>
    <a href="https://www.facebook.com/4gprotecaoveicular" class="btn-float" style="background:#1877F2;"><i class="fab fa-facebook-f"></i></a>
    <button onclick="document.getElementById('modalConsultor').style.display='flex'" class="btn-float" style="background:var(--primary);"><i class="fas fa-user-plus"></i></button>
</div>

<div id="modalConsultor" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div class="form-box">
        <h3>Seja um Consultor</h3>
        <form onsubmit="enviarDados(event, 'Cadastro Consultor')">
            <input type="text" id="cons-nome" placeholder="Nome" required>
            <input type="tel" id="cons-whatsapp" placeholder="WhatsApp" required>
            <input type="text" id="cons-cidade" placeholder="Cidade" required>
            <button type="submit" class="btn-submit">CADASTRAR</button>
        </form>
    </div>
</div>

<script>
    function enviarDados(e, tipo) {
        e.preventDefault();
        const dados = {
            tipo: tipo,
            nome: document.getElementById(tipo === 'Cotação Direta' ? 'nome' : 'cons-nome').value,
            whatsapp: document.getElementById(tipo === 'Cotação Direta' ? 'whatsapp' : 'cons-whatsapp').value,
            placa: tipo === 'Cotação Direta' ? document.getElementById('placa').value : 'N/A',
            cidade: tipo === 'Cadastro Consultor' ? document.getElementById('cons-cidade').value : 'N/A'
        };
        fetch("https://script.google.com/macros/s/AKfycbwq6moEmuFhJB_Swcnry8ql8R6FMPPzL7vogkVvK5bclVl3i07hyXi6Db95mmMOW9Qh/exec", {
            method: 'POST', mode: 'no-cors', body: JSON.stringify(dados)
        }).then(() => { alert("Enviado com sucesso!"); window.location.reload(); });
    }
</script>
</body>
</html>
