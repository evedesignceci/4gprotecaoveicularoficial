<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>4G Proteção Veicular | Cotação Rápida e Personalizada</title>
  
  <link rel="shortcut icon" href="https://res.cloudinary.com/oactqmgs/image/upload/v1786908272/4G.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #154F96; --primary-dark: #0D3668; --yellow: #FFF029; --dark: #0F172A;
      --white: #FFFFFF; --bg-light: #F8FAFC; --border-color: #E2E8F0;
      --font-title: 'Anton', sans-serif; --font-body: 'Open Sans', sans-serif;
    }
    /* Estilos originais preservados com ajustes de UX */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-light); color: var(--dark); overflow-x: hidden; }
    
    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    
    /* HEADER E NAV */
    .header { background: var(--white); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color); }
    .nav-container { display: flex; align-items: center; justify-content: space-between; height: 76px; }
    .logo-img { max-height: 48px; }
    
    .nav-menu { display: flex; gap: 24px; align-items: center; }
    .nav-menu a { text-decoration: none; color: var(--dark); font-weight: 600; font-size: 14px; }
    .hamburger-btn { display: none; background: transparent; border: none; font-size: 24px; color: var(--primary-dark); cursor: pointer; }
    
    /* BOTÕES */
    .btn { padding: 12px 22px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: 0.3s; }
    .btn-yellow { background: var(--yellow); color: #000; }
    .btn-block { width: 100%; }

    /* HERO E FORMULÁRIO */
    .hero { padding: 60px 0; background: radial-gradient(circle at 85% 15%, #1d6ec7 0%, #0A2540 70%); color: var(--white); }
    .hero-container { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .hero-form-card { background: var(--white); border-radius: 24px; padding: 32px; color: var(--dark); box-shadow: 0 24px 48px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 16px; }
    .form-group input { width: 100%; padding: 14px; border-radius: 10px; border: 1.5px solid var(--border-color); font-size: 16px; }

    /* MOBILE CTA STICKY */
    .mobile-cta { display: none; position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px; background: var(--white); box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 999; }

    @media (max-width: 820px) {
      .nav-menu { position: fixed; top: 0; right: -100%; width: 80%; height: 100vh; background: var(--white); flex-direction: column; padding: 80px 30px; transition: 0.3s; }
      .nav-menu.active { right: 0; }
      .hamburger-btn { display: block; }
      .hero-container { grid-template-columns: 1fr; }
      .mobile-cta { display: block; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container nav-container">
      <a href="#sobre"><img src="https://res.cloudinary.com/oactqmgs/image/upload/v1786908272/4G.png" alt="4G" class="logo-img"></a>
      <nav class="nav-menu" id="navMenu">
        <a href="#sobre" onclick="fecharMenuMobile()">A 4G</a>
        <a href="#parceiros" onclick="fecharMenuMobile()">Parceiros</a>
        <a href="#veiculos" onclick="fecharMenuMobile()">Proteção</a>
        <button onclick="focarNoFormulario(); fecharMenuMobile();" class="btn btn-yellow">COTAÇÃO ONLINE</button>
      </nav>
      <button class="hamburger-btn" onclick="abrirMenuMobile()"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <section class="hero" id="sobre">
    <div class="container hero-container">
      <div class="hero-text">
        <h1>Seu veículo protegido, <span>sua família tranquila.</span></h1>
        <p>Comparamos as melhores seguradoras e associações para você pagar menos.</p>
      </div>
      <div class="hero-form-card" id="cotacao">
        <h3>Simulação Grátis</h3>
        <form id="formCotacao" onsubmit="enviarLead(event)">
          <div class="form-group"><input type="text" id="nome" required placeholder="Nome Completo"></div>
          <div class="form-group"><input type="tel" id="whatsapp" required placeholder="WhatsApp com DDD"></div>
          <button type="submit" class="btn btn-yellow btn-block">RECEBER PROPOSTA NO ZAP</button>
        </form>
      </div>
    </div>
  </section>

  <div class="mobile-cta">
    <button onclick="focarNoFormulario()" class="btn btn-yellow btn-block">QUERO MINHA COTAÇÃO</button>
  </div>

  <script>
    function abrirMenuMobile() { document.getElementById('navMenu').classList.add('active'); }
    function fecharMenuMobile() { document.getElementById('navMenu').classList.remove('active'); }
    function focarNoFormulario() { document.getElementById('cotacao').scrollIntoView({ behavior: 'smooth' }); }
    
    function enviarLead(e) {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const wpp = document.getElementById('whatsapp').value;
      const url = `https://wa.me/5511957666488?text=Olá, me chamo ${nome} e quero uma cotação.`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
