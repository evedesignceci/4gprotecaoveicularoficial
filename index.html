<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4G Proteção Veicular | Corretora de Confiança</title>
  <link rel="shortcut icon" href="https://i.imgur.com/bv7IBPy.png" type="image/png">
  
  <!-- Fontes: Montserrat para títulos, Inter para corpo (Padrão de mercado atual) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --yellow: #facc15;
      --dark: #0f172a;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-300: #cbd5e1;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body { background-color: var(--gray-50); color: var(--dark); line-height: 1.6; }

    h1, h2 { font-family: 'Montserrat', sans-serif; color: var(--dark); line-height: 1.2; }
    h1 { font-size: 3rem; margin-bottom: 1.5rem; }
    
    .container { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
    
    /* Header Profissional */
    .header { background: var(--white); padding: 1rem 0; border-bottom: 1px solid var(--gray-100); position: sticky; top: 0; z-index: 100; }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .logo-img { height: 45px; }

    /* Hero Section Clean */
    .hero { padding: 80px 0; background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%); }
    .hero-content { display: grid; grid-template-columns: 1fr 400px; gap: 60px; align-items: center; }
    
    /* Card de Cotação - Estilo Apple/SaaS */
    .hero-form-card { 
      background: var(--white); 
      padding: 2.5rem; 
      border-radius: var(--radius); 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--gray-100);
    }
    
    input, select { 
      width: 100%; padding: 12px; border: 1.5px solid var(--gray-300); 
      border-radius: 8px; margin-bottom: 1rem; transition: 0.3s;
    }
    input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1); }

    .btn-cta { 
      background: var(--primary); color: white; padding: 14px; border: none; 
      border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s;
    }
    .btn-cta:hover { background: var(--primary-dark); }

    /* Seções */
    .section { padding: 80px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    
    /* Footer */
    footer { background: var(--dark); color: white; padding: 3rem 0; text-align: center; }

    @media (max-width: 768px) {
      .hero-content { grid-template-columns: 1fr; text-align: center; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container nav">
    <img src="https://i.imgur.com/bv7IBPy.png" alt="4G" class="logo-img">
    <nav style="display:flex; gap:20px; font-weight:600; font-size: 14px;">
      <a href="#sobre" style="text-decoration:none; color:var(--dark);">Sobre</a>
      <a href="#parceiros" style="text-decoration:none; color:var(--dark);">Parceiros</a>
    </nav>
  </div>
</header>

<section class="hero" id="sobre">
  <div class="container hero-content">
    <div>
      <h1>Sua tranquilidade, nossa prioridade.</h1>
      <p style="font-size: 1.1rem; color: #64748b; margin-bottom: 2rem;">As maiores seguradoras do país comparadas para você economizar com segurança.</p>
    </div>
    <div class="hero-form-card">
      <h3 style="margin-bottom: 1rem;">Cotação Rápida</h3>
      <form>
        <input type="text" placeholder="Seu nome completo">
        <input type="tel" placeholder="Seu WhatsApp">
        <input type="text" placeholder="Placa do veículo">
        <button class="btn-cta">RECEBER PROPOSTA</button>
      </form>
    </div>
  </div>
</section>

</body>
</html>
